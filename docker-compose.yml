networks:
  inception_network:
    driver: bridge
services:
  mariadb:
    container_name: mariadb
    build: srcs/requirements/mariadb
    image: mariadb
    environment:
      - DB_ROOT_PASSWORD: /run/secrets/db_root_password
      - DB_PASSWORD: /run/secrets/db_password
    secrets:
      - db_password
      - db_root_password
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - inception_network
    restart: always

  wordpress:
    container_name: wordpress
    build: srcs/requirements/wordpress
    image: wordpress
    env_file:
      - .env
    # environment:
    #   DB_PASSWORD: /run/secrets/db_password.txt
    #   WP_ADMIN_PASSWORD: /run/secrets/wp_admin_password.txt
    #   WP_USER_PASSWORD: /run/secrets/wp_user_password.txt
    secrets:
      - db_password
      - wp_admin_password
      - wp_user_password
    volumes:
      - wordpress_data:/var/www/html
    depends_on:
      - mariadb
    networks:
      - inception_network
    restart: always

  nginx:
    container_name: nginx
    build: srcs/requirements/nginx
    image: nginx
    env_file:
      - .env
    # environment:
    #   DOMAIN_NAME
    volumes:
      - wordpress_data:/var/www/html
    depends_on:
      - wordpress
    ports:
      - "443:443"
    networks:
      - inception_network
    restart: always

secrets:
  db_password:
    file: secrets/db_password.txt
  db_root_password:
    file: secrets/db_root_password.txt
  wp_admin_password:
    file: secrets/wp_admin_password.txt
  wp_user_password:
    file: secrets/wp_user_password.txt


volumes:
  mariadb_data: #nome do volume
    driver: local #meu host
    driver_opts:
      type: none
      o: bind #é pra bindar com o diretório do host, não pra criar um novo
      device: /home/lraggio/data/mariadb #conecta o volume chamado mariadb_data ao path

  wordpress_data:
    driver: local
    driver_opts:
        type: none
        o: bind
        device: /home/lraggio/data/wordpress
